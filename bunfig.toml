[test]
# Install the browser globals the app touches (localStorage, window, document,
# location) before any test module loads, so the in-browser mock adapter, its
# store, and the import-time transport decision all run unchanged headlessly.
# See test/preload.ts.
preload = ["./test/preload.ts"]

# NOTE ON PER-TEST TIMEOUTS — the budget is NOT set here.
#
# Bun reads no `timeout` key from this file (verified against 1.3.11: a declared
# value is ignored and the 5000ms built-in default still applies), so the gate
# passes `--timeout` on the command line instead. See the `test` and `check`
# scripts in the root package.json, and raise it in BOTH or the two disagree.
#
# It is raised above the built-in default because a large share of this suite is
# bound by real work rather than by the code under test: durable store writes
# fsync one at a time, and the local-review suites drive an actual `git` against
# a temporary repository. Those costs are set by the disk and by the machine, and
# a continuous-integration runner is far slower at both than a developer's SSD —
# one allocator case measured 437ms locally and 9372ms on a runner, a factor of
# twenty-one. A limit tuned to local timings is therefore not a limit at all; it
# is a coin flip that lands differently on someone else's hardware, and it lands
# as a red gate on a change that did nothing wrong.
#
# Individual cases still carry their own larger budgets where the work genuinely
# warrants one. Those are deliberate and override this default; do not remove one
# because it looks redundant.
